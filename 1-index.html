<nav id="nav"></nav><main id="main"></main>
<script>
const NOTES=["(2) إيضاح : أسس الإعداد", "بيان الإلتزام", "تم عرض القوائم المالية للجمعية والافصاح عنها وفقا لمعايير المنشأت غير الهادفة للربح المعتمدة في المملكة العربية السعودية. وتطبيق متطلبات الإثبات والقياس الواردة في المعيار الدولي للتقرير المالي للمنشأت الصغيرة ومتوسطة الحجم والإصدارات الأخرى المعتمدة من الهيئة السعودية للمراجعين والمحاسبين فيما لم يتم معالجته في معايير المنشأت غير الهادفة للربح المعتمدة في المملكة العربية السعودية.", "(1/2) عملة العرض", "تم عرض القوائم المالية بالريال السعودي، والذي يعتبر العملة الوظيفية والعملة التي يتم بها عرض القوائم المالية، تم تقريب كافة المبالغ لأقرب ريال سعودي، ما لم يرد خلاف ذلك.", "إستخدام الحكم والتقديرات", "يتطلب إعداد القوائم المالية من إدارة الجمعية إجراء أحكام وتقديرات وافتراضات تؤثر علي تطبيق السياسات المحاسبية ومبالغ الأصول والألتزامات والإيرادات والمصروفات. وتستند التقديرات والإفتراضات المتعلقة بها إلى الخبرة الشخصية المتوفرة بالجمعية وعوامل اخرى مختلفة يعتقد أنها معقولة في ظل الظروف التي ينتج عنها أساس إصدار الأحكام حول القيم الدفترية للأصول والإلتزامات التي لاتظهر بسهولة عن غيرها من المصادر. وبالتالي قد تختلف النتائج الفعلية عن تلك التي بنيت على أساسها التقديرات. وتتم مراجعة التقديرات والإفتراضات الأساسية بشكل مستمر ويتم الأعتراف بالتعديلات علي التقديرات المحاسبية في الفترة التي يتم فيها مراجعة التقديرات إذا كان التعديل يؤثر على كل الفترات الحالية والمستقبلية.", "تصنيف الأصول والالتزامات كمتداولة وغير متداولة", "تعد الأصول متداولة عندما:", "1- يتوقع تحققها أو ينوى بيعها أو إستنفادها خلال دورة العمليات العادية.\n2- في حالة إقتنائها بشكل أساس لأغراض المتاجرة.\n3- يتوقع تحققها خلال إثني عشر شهراً بعد الفترة المالية.\n4- تكون نقدية وشبه نقدية ما لم تكن هناك قيود على إستبدالها أو إستخدامها لسداد أي مطلوبات لمدة لا تقل عن اثني عشر شهراً بعد الفترة المالية.", "تصنف الجمعية الأصول الأخرى كافة كـ \"غير متداولة\".", "(2)  أسس الإعداد (تتمة)", "تصنيف الأصول والالتزامات كمتداولة وغير متداولة (تتمة)", "تعد كافة الالتزامات متداولة عندما :", "1- يتوقع سدادها خلال دورة العمليات العادية.\n2- في حالة اقتنائها بشكل أساس لأغراض المتاجرة.\n3- تستحق السداد خلال اثني عشر شهراً بعد الفترة المالية.\n4- عند عدم وجود حق غير مشروط لتأجيل سداد الالتزامات لمدة لا تقل عن اثني عشر شهراً بعد الفترة المالية.", "تصنف الجمعية الالتزامات الأخرى كافة كـ غير متداولة\".", "عرض فئات الأصول إلى غير مقيدة ومقيدة", "الأصول غير المقيدة", "هي الأصول التي لا تخضع لقيود من جانب المتبرع وبذلك هي تحت السيطرة الكاملة لإدارة الجمعية.", "الأصول المقيدة", "هي الأصول التي تخضع لقيود من جانب المتبرع، حيث تمثل المعلومات المتعلقة بالقيود المفروضة على الأصول أو فئات من صافي الأصول وتأثير ذلك على أصول أو التزامات معينة مهمة لأجل تقييم المرونة المالية للجمعية. وتصنف الجمعية تلك القيود بقيود استخدام أو قيود وقت أو قيود استخدام ووقت معا أو قيود مفروضة على استخدام أصول الأوقاف لأغراض معينة وللمحافظة عليها ولاستثمارها من أجل توفير مصدر دائم للدخل. قد تكون القيود مفروضة من المتبرع. وقد تكون القود ذاتية تقرضها إدارة الجمعية مع ضرورة الإفصاح حال رفع تلك القيود سواء نتيجة الوفاء بمتطلبات المتبر أو برفعها ذاتيا أو بانتهاء الاستخدام أو الوقت المحدد.", "أنشطة الجمعية", "تقوم الجمعية بإعداد قائمة للأنشطة في نهاية الفترة المالية والتي تتضمن الإيرادات والمصروفات والمكاسب والخسائر، والتحويلات بين فئات الأصول بوصفها تغيرات في صافي الأصول بتفاصيلها المتضمنة التغير في صافي الأصول غير المقيدة، والتغير في صافي الأصول المقيدة، والتغير في صافي أصول الأوقاف. وتقوم الجمعية بإظهار التغيرات في صافي الأصول في قائمة مالية واحدة بحيث توضح الدخل الشامل الناتج من العمليات المستمرة للجمعية أو غير المستمرة والذي يمثل صافي التغير خلال الفترة ثم يتم إضافة عناصر الدخل الشامل الأخر إن وجدت والتي تم تحديدها في المعيار الدولي للتقرير المالي للمنشآت الصغيرة ومتوسطة الحجم المعتمدة في المملكة العربية السعودية.", "صافي الأصول", "تعرض الجمعية بنود مجموعة صافي الأصول في صلب قائمة المركز المالي بصورة مستقلة وفقا للترتيب التالي بداية بصافي الأصول غير المقيدة ثم صافي الأصول المقيدة ثم صافي أصول الأوقاف إن وجدت. وتقوم الجمعية بتعديل صافي الأصول بحسب التغيرات المختلفة التي تؤثر عليها.", "التغيرات في صافي الأصول:", "تعرض الجمعية في قائمة الأنشطة التغيرات في صافي الأصول غير المقيدة والتغيرات في صافي الأصول المقيدة والتغيرات في صافي أصول الأوقاف (إن وجدا) بما تؤديه بنود الدخل والمصروفات والتحويلات وإعادة التصنيف إلى زيادة صافي الأصول أو تخفيضها. وتقوم الجمعية بعرض التغيرات في صافي الأصول على أساس وظيفي طبقا للأنواع المختلفة من البرامج المقدمة والأنشطة المساندة في صلب قائمة الأنشطة او الإفصاح عنها في إيضاحات قوائم الجمعية المالية المرفقة. حيث يجب إظهار التغيرات في صافي الأصول في قائمة مالية واحدة شاملة للأنشطة بحيث تعرض مكونات التغيرات في صافي الأصول بصورة مستقلة قدر الإمكان مثل التغيرات من العمليات المستمرة أو العمليات غير المستمرة والذي يمثل مجموعهما التغيرات خلال الفترة والذي يضاف إليه الدخل الشامل الآخر إن وجد ليمثل المجموع لدخل الشامل للجمعية.", "الذمم المدينة:", "تثبت الذمم المدينة بصافي قيمتها القابلة للتحقق بعد أخذ مخصص كافي للديون المشكوك في تحصيلها , وتخصم الديون المعدومة عند تكبدها .", "المخـــــزون الســـــلعى :-", "(أ) المخزون من البضاعة المتبرع بها للجمعية والتى لم تُصرف حتى تاريخ القوائِم المالية يتم إثباتها بسعر تقييمها عند إستلامها.", "(ب) المخزون من البضاعة المشتراه يتم إثباتها على أساس التكلفة الفعلية وطبقاً لطريقة الوارد أولاً يُصرف أولاً وذلك بالنسبة للمواد الغذائية والأدوية .", "التغيرات في صافي الأصول (تتمة)", "التغيرات في صافي الأصول غير المقيدة", "يمثل التغير في صافي الأصول غير المقيدة عن مقدار الزيادة أوالنقص في كل الإيرادات والمصروفات أوالمكاسب والخسائر التي لا تعتبر تغيرات في أصول مقيدة أو أوقاف وكذلك التحويلات وإعادة التصنيف من وإلى فئات صافي الأصول الأخرى نتيجة رفع القيود.", "(3) السياسات المحاسبية الجوهرية", "تم إعداد القوائم المالية المرفقة وفقاً للمعيار الدولي للتقريرالمالي للمنشأت غير الهادفة للربح وتطبيق متطلبات الإثبات والقياس الواردة في المعيار الدولي للتقرير المالي للمنشأت الصغيرة ومتوسطة الحجم والإصدارات الأخرى المعتمدة من الهيئة السعودية للمراجعين والمحاسبين.", "النقذ ومافي حكمها", "يتكون النقد وما في حكمه من النقد في الصندوق ولدى البنوك وودائع لأجل تستحق خلال ثلاثة أشهر أو أقل من تاريخ الاقتناء وقابلة للتحويل إلى مبالغ نقدية معروفة، وتخضع لمخاطر غير جوهرية بشأن التغيرات في القيمة. وتقوم الجمعية بالتقرير بشكل منفصل عن النقد والمطالبات بالنقد التي تستوفي التقييد في السحب أو الاستخدام بخلاف العمليات التشغيلية أو المحتفظ به مؤقتا لحين العثور على فرص استثمارية أو المقيد لتغطية النفقات المتعلقة باقتناء أو إنشاء أصول غير متداولة وكذلك النقد المطلوب عزله لتصفية الديون طويلة الأجل أو النقد المقيد لاستخدام طويل الأجل مفروض من المتبرعين أو بموجب اتفاقيات الديون أو التي تم تجنبيها لمقابلة تكوين احتياطيات مشترطة نظاما إن وجدت أو قيود بموجب ترتيبات ضمانات إضافية أو مقيدة لاستخدامات طويلة أجل بموجب قيود المتبرعين", "ممتلكات ومعدات", "تتمثل ممتلكات ومعدات الجمعية والتي تم إقتنائها بهدف إستخدامها في تسيرعمليات وأنشطة الجمعية وليس بغرض البيع.", "تقيد الممتلكات والمعدات بالتكلفة مضافا اليها كافة المصاريف الآزمة لجعل الأصل الثابت جاهز للأستخدام، وتظهر بالتكلفة ناقصا  الإستهلاك المتراكم و أي إنخفاض في القيمة، تستهلك التكلفة ناقصا القيمة التقديرية المتبقية بطريقة القسط الثابت علي مدى الأعمار الإنتاجية المقدرة للموجودات كمايلي:", "مباني                                             4% | سيارات                                       20%", "أجهزة وعدد                                     15% | اثاث ومفروشات                              10%", "برامج                                          10% | متجر الكتروني                               10%", "الإنخفاض في قيمة الموجودات", "تقوم الجمعية بتاريخ كل قائمة مركز مالي بمراجعة قيم ممتلكاتها ومعداتها للتأكد من عدم وجود مؤشر يدل على إنخفاض في قيمة تلك الموجودات، وفي حالة وجود هذا المؤشر يتم تحديد القيمة المقدرة للإستدراك لتلك الموجودات للتوصل إلى قيمة الإنخفاض في الموجودات ( إن وجدت )، وفي حالة عدم القدرة على تقدير القيمة القابلة للإستدراك لقيم إحدى الموجودات، تقوم الجمعية بتقدير القيمة القابلة للإستدراك لكامل الوحدة الإنتاجية التي يعود إليها ذلك الأصل.", "يتم تخفيض القيمة الدفترية للأصل لتساوي قيمته المقدرة للإسترداد في حالة أن الأصل أقل من قيمته الدفترية. يتم تسجيل الخسارة الناتجة عن التخفيض في قيمة الأصل كمصروف فور حدوثه، عند عكس قيمة الإنخفاض في الأصل في السنة اللآحقة ويتم تعديل القيمة الدفترية للأصل بزيادتها إلى القيمة المقدرة للإسترداد المعدلة بشرط ألا تتعدى هذه الزيادة القيمة الدفترية للأصل في السنوات السابقة، يتم إثبات قيمة العكس في خسارة التخفيض كإيراد عند حدوثه.", "السياسات المحاسبية الجوهرية (تتمة)", "أصول الأوقاف", "يتم فصل الأصول الوقفية في مجموعة خاصة نظرا لخصوصية أصول الأوقاف الشرعية والتي تقضي باستخدام هذة الأصول في أغراض محددة سابقا تم اثباتها في صكوك الوقفية والتي ينبغي الألتزام بها بالإضافة الي ضرورة المحافظة على هذه الأصول الوقفية والعناية بها واستثمارها بما يحقق أهداف الواقف ويعود بالنفع على المستفدين من عوائد وإيرادات هذه الأوقاف.", "الدائنون التجاريون والمبالغ المستحقة الدفع والدائنون الأخرون", "يتم اثبات الإلتزامات مقابل المبالغ الواجب دفعها في المستقبل عن البضاعة أو الخدمات المستلمة، سواء قدمت أم لم تقدم بها فواتير من قبل الموردين. الذمم الدائنة التجارية هي عبارة عن التزامات بسداد قيمة البضائع أو الخدمات التي يتم الحصول عليها في سياق العمل الأعتيادي من الموردين، يتم تصنيف الذمم الدائنة التجارية كمطلوبات متداولة اذا كانت هذة الذمم مستحقة السداد خلال سنة واحدة أو اقل، وإلاّ يتم عرضها كمطلوبات غير متداولة ويتم اثبات الذمم الدائنة مبدئيا بسعر المعاملة.", "مكافأة نهاية الخدمة :-", "يجنب مخصص لمكافأة نهاية الخدمة المستحقة للموظفين عن فترات خدمتهم المتجمعة بتاريخ قائمة المركز المالي وفقا لإحكام نظام العمل و العمال في المملكة العربية السعودية.", "الاستثمارات المالية :-", "تقوم الجمعية بتسجيل أستثماراتها بموجب التكلفة الفعلية عند أقتنائها ولا يتم إثبات الايرادات الخاصة بها إلا عند أستلامها فعليا .", "ضريبة القيمة المضافة:-", "تقوم الجمعية بتسجيل الضريبة على مشترياتها تمهيدا لاستردادها من قبل الزكاة والضريبة والجمارك حسب التعامم الواردة بهذا الخصوص من وزارة الموارد البشرية والقرارات والإجراءات ذات الصلة من هيئة الزكاة والضريبة والجمارك وذلك حال قبولها كمنشاه قابلة للاسترداد بسبب النشاط", "قائمة الأنشطة", "تم عرض المعلومات عن الإيرادات والمصروفات على الأساس الوظيفي، طبقا للأنواع المختلفة من البرامج المقدمة، و الأنشطة المساندة.", "أ- الاعتراف بالإيرادات و التبرعات", "تعد التبرعات تحويلات غير مشروطة الأصول، سواء أكان ذلك في صورة نقدية، أو في صورة أصول أخرى إلى جهة ما، أو تعد سدادا او إسقاطا لما علي function parseLedger(text){const rows=text.split(/\r?\n/).filter(l=>l.trim()).map(splitLine);let di=-1,ci=-1,dt=-1,ds=-1,rf=-1;
 for(let i=0;i<Math.min(3,rows.length);i++){const r=rows[i].map(norm);const d=r.findIndex(x=>/^(مدين|debit)/.test(x)),k=r.findIndex(x=>/^(دا[ئي]ن|credit)/.test(x));if(d>=0&&k>=0){di=d;ci=k;dt=r.findIndex(x=>/(تاريخ|date)/.test(x));ds=r.findIndex(x=>/(بيان|وصف|description)/.test(x));rf=r.findIndex(x=>/(مستند|قيد|مرجع|رقم|ref|doc)/.test(x));rows.splice(0,i+1);break}}
 const out=[];rows.forEach(r=>{let d='',desc='',dr=0,cr=0,ref='';
  if(di>=0){dr=num(r[di])||0;cr=num(r[ci])||0;d=dt>=0?r[dt]:'';desc=ds>=0?r[ds]:(r.find((x,j)=>j!==di&&j!==ci&&x&&!isNum(x))||'');ref=rf>=0&&rf!==dt?r[rf]:''}
  else{const ni=[];r.forEach((x,j)=>{if(isNum(x))ni.push(j)});const tx=r.map((x,j)=>({x,j})).filter(o=>o.x&&!isNum(o.x));const dd=tx.find(o=>/\d{1,4}[\/\-.]\d{1,2}[\/\-.]\d{1,4}/.test(o.x));d=dd?dd.x:'';const de=tx.filter(o=>o!==dd);desc=(de[0]||{}).x||'';ref=(de[1]||{}).x||'';
   const ns=ni.filter(j=>!/^\d{1,4}[\/\-.]/.test(r[j]));const last=ns.slice(-2);if(last.length===2){dr=num(r[last[0]]);cr=num(r[last[1]])}else if(last.length===1){const v=num(r[last[0]]);if(v>=0)dr=v;else cr=-v}}
  if(!dr&&!cr)return;if(/^(الاجمالي|اجمالي|المجموع|رصيد)/.test(norm(desc)))return;out.push({d,desc,dr,cr,ref})});return out}
function prng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function draw(){const a=S.tb.find(x=>x.id===ledSel);const led=(S.ledgers[a.id]||[]).map((r,i)=>({i,d:r.d,desc:r.desc,ref:r.ref,amt:(num(r.dr)||0)-(num(r.cr)||0)})).filter(r=>r.amt!==0);
 const p=(S.samples[a.id]||{}).p||{n:7,key:S.pm||0,seed:1,method:'mus'};if(!led.length){ledMsg='ألصق الكشف أولاً.';return}
 const rnd=prng(+p.seed||1),sel=[],used=new Set(),key=num(p.key)||0;
 if(key>0)led.forEach(r=>{if(Math.abs(r.amt)>=key){sel.push({...r,why:'بند كبير'});used.add(r.i)}});
 const rest=led.filter(r=>!used.has(r.i)),n=Math.max(0,Math.min(+p.n||0,rest.length));
 if(p.method==='rnd'){const pool=rest.slice();for(let k=0;k<n;k++){const j=Math.floor(rnd()*pool.length);sel.push({...pool[j],why:'عشوائي'});pool.splice(j,1)}}
 else if(n>0){const total=rest.reduce((s,r)=>s+Math.abs(r.amt),0),iv=total/n;let pt=rnd()*iv,cum=0;const got=new Set();
  rest.forEach(r=>{cum+=Math.abs(r.amt);while(pt<cum){if(!got.has(r.i)){got.add(r.i);sel.push({...r,why:'حسب القيمة'})}pt+=iv}})}
 sel.sort((x,y)=>x.i-y.i);S.samples[a.id]={p,items:sel.map(r=>({d:r.d,desc:r.desc,ref:r.ref,amt:r.amt,why:r.why}))};ledMsg='تم سحب '+sel.length+' عنصر.'}

 +fr('الذمم المدينة',F.recv)+fr('مصاريف مدفوعة مقدماً',F.prepaid)+fr('المخزون',F.inv)+fr('مصاريف مستحقة',F.accr)+fr('دائنون وأرصدة دائنة أخرى',F.otherpay)+ft('صافي التدفقات النقدية من الأنشطة التشغيلية',F.op,pr?num(pc.op)||0:null)
 +`<tr class="hd"><td colspan=${pr?3:2}>التدفقات النقدية من الأنشطة الاستثمارية</td></tr>`+fr('شراء وإضافات أصول ثابتة',F.ppe)+fr('إضافات أصول غير ملموسة',F.intang)+fr('إضافات أصول استثمارية',F.invprop)+fr('استثمارات طويلة الأجل',F.invest)+fr('إضافات أصول ثابتة وقفية',F.e_ppe)+fr('إضافات مشروعات تحت التنفيذ',F.e_cip)+ft('صافي التدفقات النقدية من الأنشطة الاستثمارية',F.ivs,pr?num(pc.inv)||0:null)
 +`<tr class="hd"><td colspan=${pr?3:2}>التدفقات النقدية من الأنشطة التمويلية</td></tr>`+fr('قروض',F.fin)+ft('صافي التدفقات النقدية من الأنشطة التمويلية',F.fin,pr?num(pc.fin)||0:null)
 +ft('التغير في النقدية خلال السنة',F.net,pr?pnet:null)+ft('النقدية وما في حكمها أول السنة',F.c0,pr?pc0:null)+ft('النقدية وما في حكمها آخر السنة',F.c1,pr?pc0+pnet:null)+`</table><p class="note">مسودة محسوبة من الفروق بين أرصدة السنتين. الإضافات تُقدَّر من فرق الرصيد مع الإهلاك وتحتاج مطابقتها مع بيان الأصول والتسويات الفعلية. النقدية تشمل النقدية الموقوفة.</p></div>`;
 const nt=LN.filter(l=>N[l.id]).map(l=>{const rows=c.accs[l.id].map(o=>`<tr><td>${E(o.a.name)}</td><td class="n">${fm(o.v,1)}</td></tr>`).join('');return`<h3>(${N[l.id]}) ${l.ar}</h3><table><tr><th>الحساب</th><th class="n">${yr}</th></tr>${rows}<tr class="tot"><td>الإجمالي</td><td class="n">${fm(c.cur[l.id],1)}</td></tr></table>${pr&&c.P(l.id)?`<p class="note">رصيد ${yp}: ${fm(c.P(l.id))}</p>`:''}`}).join('');
 const org=`<h3>(1) التنظيم والعمليات</h3><p>اسم الجمعية: ${E(k.name)}<br>المركز الرئيسي: ${E(k.region)}<br>رقم التسجيل لدى المركز الوطني لتنمية القطاع غير الربحي: ${E(k.reg)}<br>السنة المالية: من 1 يناير ${yr}م إلى 31 ديسمبر ${yr}م</p><p class="note">أهداف الجمعية: تُستكمل من النظام الأساسي.</p>`;
 const pol=NOTES.map(t=>{const hd=(t.length<60&&!/[.؛]$/.test(t)&&!/^\d/.test(t));return hd?`<h3>${E(t)}</h3>`:`<p style="white-space:pre-line">${E(t.replace(/جمعية البر[^،.\n]*/g,k.name||'الجمعية'))}</p>`}).join('');
 const ev=`<h3>الأحداث اللاحقة</h3><p>حسب رأي الإدارة، لم تكن هناك أحداث لاحقة هامة منذ تاريخ القوائم المالية تتطلب الإفصاح أو التعديل.</p><h3>عام</h3><p>تم تقريب الأرقام الواردة في القوائم المالية إلى أقرب ريال سعودي.</p><h3>اعتماد القوائم المالية</h3><p>تم اعتماد القوائم المالية من قبل الإدارة بتاريخ ${E(k.appr||'.......')}.</p>`;
 const notes=hdr('إيضاحات حول القوائم المالية للسنة المنتهية في 31 ديسمبر '+yr+'م')+org+pol+'<h3>تفاصيل بنود القوائم</h3>'+nt+ev+'</div>';
 const status=Math.abs(c.diff)<1&&!c.unm.length?'<span class="ok">القوائم متوازنة</span>':`<span class="bad">تنبيه: ${c.unm.length?c.unm.length+' حساب غير مصنف. ':''}${Math.abs(c.diff)>=1?'فرق في التوازن '+fm(c.diff):''}</span>`;
 return`<div class="card"><h2>مسودة القوائم المالية (نموذج الجمعيات - ${pr?'مع سنة سابقة':'سنة أولى'})</h2><p>${status}</p><button class="b" data-act="fsxls">تنزيل القوائم (إكسل)</button><button class="b s" data-act="print">طباعة / PDF</button>
 <p class="note">المسودة تُبنى من الميزان والتصنيف. تقرير المراجع والغلاف والفهرس وأهداف الجمعية تُستكمل يدوياً. أرقام الإيضاحات تتبع البنود الموجودة فقط.</p></div><div id="fsarea">${bs+act+na+cf+notes}</div>`}
function rChk(c){const ck=(ok,t,d)=>`<tr><td>${ok?'<span class="ok">✓</span>':'<span class="bad">✗</span>'}</td><td>${t}</td><td>${d||''}</td></tr>`;const k=S.client;
 const rows=[ck(S.tb.length>0,'تم إدخال ميزان المراجعة',S.tb.length+' حساب'),ck(Math.abs(c.td-c.tc)<1,'الميزان متوازن (مدين = دائن)','فرق '+fm(c.td-c.tc)),ck(!c.unm.length,'كل الحسابات مصنفة في بنود القوائم',c.unm.map(a=>E(a.name)).join('، ')),
 ck(Math.abs(c.diff)<1,'الأصول = الالتزامات + صافي الأصول','فرق '+fm(c.diff))];
 if(k.mode==='prior'){rows.push(ck(Math.abs(c.pA-c.pL-c.pNA)<1,'القوائم السابقة متوازنة','فرق '+fm(c.pA-c.pL-c.pNA)));
  ['U','R','E'].forEach(x=>rows.push(ck(Math.abs(c.naD[x])<1,'رصيد أول المدة (الدفاتر) = رصيد آخر القوائم السابقة: '+CLS[x],'فرق '+fm(c.naD[x]))))}
 rows.push(ck(Math.abs(c.F.chk)<1,'التدفقات النقدية تطابق التغير في النقدية بالميزان','فرق '+fm(c.F.chk)));
 const lg=S.tb.filter(a=>(S.ledgers[a.id]||[]).length).length;rows.push(ck(lg>0,'كشوف حسابات مدخلة',lg+' كشف'));
 return`<div class="card"><h2>فحوصات</h2><table><tr><th></th><th>الفحص</th><th>التفصيل</th></tr>${rows.join('')}</table>
 <h3>الأهمية النسبية (اختياري)</h3><label>الأهمية الكلية المعتمدة (ريال)</label><input class="num" data-pm value="${S.pm||''}" style="max-width:240px"><p class="note">تُستخدم كحد مقترح للبنود الكبيرة عند سحب العينات الجديدة.</p></div>`}
function dl(name,blob){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},500)}
function xlsHtml(inner){return new Blob(['\ufeff<html dir="rtl"><head><meta charset="utf-8"><style>table{border-collapse:collapse}td,th{border:1px solid #999;padding:3px}</style></head><body>'+inner+'</body></html>'],{type:'application/vnd.ms-excel'})}
function addTB(list,replace){if(replace){S.tb=[];S.map={}}list.forEach(a=>{S.tb.push(a);const s=suggest(a.name);if(s)S.map[a.id]={line:s,cls:L[s].cls}})}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-act],[data-del]');if(!t)return;
 if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0);return}
 if(t.dataset.del){S.tb=S.tb.filter(a=>a.id!==t.dataset.del);delete S.map[t.dataset.del];save();render();return}
 const a=t.dataset.act;if(t.tagName==='INPUT')return;
 if(a==='tbadd'||a==='tbreplace'){const l=parseTB($('tbpaste').value);if(!l.length){alert('لم أجد أرصدة في النص الملصوق');return}addTB(l,a==='tbreplace');save();render()}
 else if(a==='tbrow'){S.tb.push({id:nid(),code:'',name:'',dr:0,cr:0});save();render()}
 else if(a==='automap'){S.tb.forEach(x=>{if(!(S.map[x.id]||{}).line){const s=suggest(x.name);if(s)S.map[x.id]={line:s,cls:L[s].cls}}});save();render()}
 else if(a==='backup'){dl('audit-backup-'+(S.client.name||'client')+'.json',new Blob([JSON.stringify(S)],{type:'application/json'}))}
 else if(a==='reset'){if(confirm('سيتم مسح كل بيانات العميل الحالي من هذا الجهاز. هل أخذت نسخة احتياطية؟')){S=blank();save();ledSel='';render()}}
 else if(a==='print'){window.print()}
 else if(a==='pbcxls'){dl('طلبات-العميل.xls',xlsHtml(readTable($('pbct'))))}
 else if(a==='fsxls'){dl('القوائم-المالية-مسودة.xls',xlsHtml($('fsarea').innerHTML))}
 else if(a==='draw'){draw();save();render()}
 else if(a==='samplexls'){const ac=S.tb.find(x=>x.id===ledSel);dl('عينة.xls',xlsHtml('<h4>'+E(ac?ac.name:'')+'</h4>'+readTable($('smt'))))}
 else if(a==='ledadd'){const l=parseLedger($('ledpaste').value);if(!l.length){ledMsg='لم أجد حركات في النص.';render();return}S.ledgers[ledSel]=l;delete S.samples[ledSel];ledMsg='تم إدخال '+l.length+' حركة.';save();render()}
});
function readTable(tb){let h='<table>';tb.querySelectorAll('tr').forEach(r=>{h+='<tr>';r.querySelectorAll('th,td').forEach(c=>{let v;const s=c.querySelector('select'),i=c.querySelector('input');if(s)v=s.value;else if(i)v=i.type==='checkbox'?(i.checked?'✓':''):i.value;else v=c.textContent;h+='<td'+(c.colSpan>1?' colspan='+c.colSpan:'')+'>'+E(v)+'</td>'});h+='</tr>'});return h+'</table>'}
document.addEventListener('change',async e=>{const t=e.target,d=t.dataset;let r=false;
 if(d.c!==undefined){S.client[d.c]=d.c==='year'?(+t.value||S.client.year):t.value;r=d.c==='mode'}
 else if(d.reclass!==undefined){S.reclass=num(t.value)||0}
 else if(d.tbf){const a=S.tb.find(x=>x.id===d.id);a[d.tbf]=(d.tbf==='dr'||d.tbf==='cr')?(num(t.value)||0):t.value;if(d.tbf==='name'&&!(S.map[a.id]||{}).line){const s=suggest(a.name);if(s)S.map[a.id]={line:s,cls:L[s].cls}}r=true}
 else if(d.map){S.map[d.map]=S.map[d.map]||{};S.map[d.map].line=t.value;S.map[d.map].cls=t.value?L[t.value].cls:'';r=true}
 else if(d.cls){S.map[d.cls].cls=t.value;r=true}
 else if(d.prior){S.prior[d.prior]=num(t.value)||0;t.value=S.prior[d.prior]||''}
 else if(d.pcf){S.pcf[d.pcf]=num(t.value)||0}
 else if(d.pst){(S.pbc[d.pst]=S.pbc[d.pst]||{}).st=t.value}
 else if(d.pnote){(S.pbc[d.pnote]=S.pbc[d.pnote]||{}).note=t.value}
 else if(d.pm!==undefined){S.pm=num(t.value)||0}
 else if(d.ledsel!==undefined){ledSel=t.value;ledMsg='';r=true}
 else if(d.sp){const s=S.samples[ledSel]=S.samples[ledSel]||{p:{n:7,key:S.pm||0,seed:1,method:'mus'},items:[]};s.p[d.sp]=(d.sp==='method')?t.value:(num(t.value)||0)}
 else if(d.sck){const it=S.samples[ledSel].items[+d.i];it[d.sck]=d.sck==='note'?t.value:t.checked}
 else if(d.act==='tbfile'||d.act==='ledfile'){const f=t.files[0];if(!f)return;let text;try{text=/\.xlsx$/i.test(f.name)?await readXlsx(await f.arrayBuffer()):await f.text()}catch(x){alert('تعذرت قراءة الملف. انسخ الجدول من إكسل والصقه في المربع.');return}
  if(d.act==='tbfile'){const l=parseTB(text);if(!l.length){alert('لم أجد أرصدة في الملف');return}addTB(l,false)}else{const l=parseLedger(text);S.ledgers[ledSel]=l;delete S.samples[ledSel];ledMsg='تم إدخال '+l.length+' حركة.'}r=true}
 else if(d.act==='restore'){const f=t.files[0];if(!f)return;try{S=Object.assign(blank(),JSON.parse(await f.text()));r=true}catch(x){alert('ملف غير صالح')}}
 else return;
 save();if(r)render();else $('nav').lastChild.textContent=saveMsg});
render();
</script></body></html>
